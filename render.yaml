services:
  - type: web
    name: telegram-trade-planner-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: '["https://YOUR_NETLIFY_APP_NAME.netlify.app"]'
      - key: TELEGRAM_MOCK_MODE
        value: "false"
    disk:
      name: trade-planner-data
      mountPath: /var/data
      sizeGB: 1

